<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1400" viewBox="0 0 2200 1300">
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#465261"/>
    </marker>
    <marker id="blueArrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#2f6f9f"/>
    </marker>
    <marker id="greenArrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#2f7d62"/>
    </marker>
    <marker id="orangeArrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#c06a13"/>
    </marker>
    <marker id="purpleArrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#665191"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 44px Arial, sans-serif; fill: #13213a; }
      .subtitle { font: 400 22px Arial, sans-serif; fill: #5f6f7e; }
      .section { font: 700 26px Arial, sans-serif; fill: #13213a; }
      .label { font: 700 20px Arial, sans-serif; fill: #13213a; }
      .small { font: 400 17px Arial, sans-serif; fill: #374151; }
      .tiny { font: 400 13px Arial, sans-serif; fill: #5f6f7e; }
      .note { font: 700 14px Arial, sans-serif; fill: #7c4a03; }
      .whiteLabel { font: 700 20px Arial, sans-serif; fill: #ffffff; }
      .whiteSmall { font: 400 16px Arial, sans-serif; fill: #ffffff; }
      .box { stroke-width: 2.2; filter: url(#shadow); }
      .line { stroke: #465261; stroke-width: 3.2; fill: none; marker-end: url(#arrow); }
      .blueLine { stroke: #2f6f9f; stroke-width: 3.2; fill: none; marker-end: url(#blueArrow); }
      .greenLine { stroke: #2f7d62; stroke-width: 3.2; fill: none; marker-end: url(#greenArrow); }
      .orangeLine { stroke: #c06a13; stroke-width: 3.2; fill: none; marker-end: url(#orangeArrow); }
      .purpleLine { stroke: #665191; stroke-width: 3.2; fill: none; marker-end: url(#purpleArrow); }
      .dash { stroke-dasharray: 9 8; }
      .tag { font: 700 14px Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect width="2400" height="1400" fill="#f7f3ea"/>
  <text x="70" y="64" class="title">Medical-SAM3 / VisiumHD Exp1: What Was Trained and Tested</text>
  <text x="72" y="102" class="subtitle">Input is part of the framework; retrieval connects the learned space back to SAM3 mask / prompt ranking.</text>

  <rect x="1580" y="30" width="545" height="100" rx="18" fill="#fffdf6" stroke="#d8d2c3" stroke-width="2"/>
  <rect x="1610" y="58" width="27" height="17" rx="4" fill="#ddeff5" stroke="#2f6f9f"/>
  <text x="1650" y="72" class="tiny">Changed in experiment</text>
  <rect x="1610" y="90" width="27" height="17" rx="4" fill="#e3f3ea" stroke="#2f7d62"/>
  <text x="1650" y="104" class="tiny">Trainable / fine-tuned</text>
  <rect x="1845" y="58" width="27" height="17" rx="4" fill="#fff2d8" stroke="#d97706"/>
  <text x="1885" y="72" class="tiny">Loss / supervision</text>
  <rect x="1845" y="90" width="27" height="17" rx="4" fill="#e9e3f6" stroke="#665191"/>
  <text x="1885" y="104" class="tiny">Retrieval / SAM3 use</text>

  <!-- Main framework -->
  <text x="70" y="175" class="section">1. Full training framework: inputs -> two towers -> shared embedding -> total loss</text>
  <rect x="70" y="205" width="2055" height="540" rx="28" class="box" fill="#fffdf6" stroke="#d8d2c3"/>

  <!-- Image branch -->
  <rect x="115" y="292" width="255" height="125" rx="18" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/>
  <text x="145" y="325" class="label">H&amp;E crop</text>
  <text x="145" y="356" class="small">Square image patch around</text>
  <text x="145" y="380" class="small">one VisiumHD coordinate.</text>
  <text x="145" y="405" class="tiny">crop64 / crop128 tested</text>

  <rect x="450" y="270" width="300" height="165" rx="20" fill="#ddeff5" stroke="#2f6f9f" stroke-width="2.2"/>
  <rect x="470" y="288" width="36" height="22" rx="7" fill="#2f6f9f"/>
  <text x="482" y="304" class="tag">A</text>
  <text x="520" y="305" class="label">Image encoder</text>
  <text x="520" y="338" class="small">ResNet50 or GigaPath</text>
  <text x="520" y="365" class="tiny">Backbone baseline changes here.</text>
  <text x="520" y="391" class="tiny">Fine-tuning unfreezes last 1/2</text>
  <text x="520" y="413" class="tiny">GigaPath transformer blocks here.</text>

  <rect x="835" y="270" width="260" height="165" rx="20" fill="#e3f3ea" stroke="#2f7d62" stroke-width="2.2"/>
  <rect x="855" y="288" width="36" height="22" rx="7" fill="#2f7d62"/>
  <text x="867" y="304" class="tag">B</text>
  <text x="905" y="305" class="label">Image projection</text>
  <text x="905" y="338" class="small">trainable head</text>
  <text x="905" y="365" class="tiny">Embedding size changes here:</text>
  <text x="905" y="388" class="tiny">embed128 vs embed512.</text>

  <!-- Expression branch -->
  <rect x="115" y="520" width="255" height="125" rx="18" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/>
  <text x="145" y="552" class="label">Expression vector</text>
  <text x="145" y="584" class="small">18,085-gene log-normalized</text>
  <text x="145" y="608" class="small">VisiumHD expression profile.</text>
  <text x="145" y="633" class="tiny">same spatial location as crop</text>

  <rect x="450" y="505" width="300" height="155" rx="20" fill="#e3f3ea" stroke="#2f7d62" stroke-width="2.2"/>
  <text x="485" y="545" class="label">Expression MLP</text>
  <text x="485" y="578" class="small">trainable molecular branch</text>
  <text x="485" y="607" class="tiny">maps gene vector to embedding</text>

  <rect x="835" y="505" width="260" height="155" rx="20" fill="#e3f3ea" stroke="#2f7d62" stroke-width="2.2"/>
  <rect x="855" y="523" width="36" height="22" rx="7" fill="#2f7d62"/>
  <text x="867" y="539" class="tag">B</text>
  <text x="905" y="540" class="label">Expression projection</text>
  <text x="905" y="573" class="small">trainable head</text>
  <text x="905" y="600" class="tiny">same output dimension as</text>
  <text x="905" y="623" class="tiny">image projection</text>

  <rect x="1190" y="385" width="280" height="150" rx="25" fill="#203b63" stroke="#13213a" stroke-width="2.2"/>
  <text x="1225" y="430" class="whiteLabel">Shared embedding space</text>
  <text x="1225" y="463" class="whiteSmall">H&amp;E and expression vectors</text>
  <text x="1225" y="488" class="whiteSmall">are compared here</text>
  <text x="1225" y="513" class="whiteSmall">for retrieval and fusion</text>

  <!-- Label target -->
  <rect x="115" y="675" width="980" height="42" rx="13" fill="#fff2d8" stroke="#d97706" stroke-width="2"/>
  <text x="140" y="702" class="note">Tissue label for CE: 3-class = tumor / stroma / immune infiltration; 8-class = fine expert tissue labels.</text>

  <!-- Loss right side -->
  <rect x="1565" y="295" width="405" height="112" rx="20" fill="#fff2d8" stroke="#d97706" stroke-width="2.2"/>
  <rect x="1585" y="313" width="36" height="22" rx="7" fill="#d97706"/>
  <text x="1597" y="329" class="tag">C</text>
  <text x="1635" y="330" class="label">Classification loss</text>
  <text x="1635" y="361" class="small">L_cls = CE_img + CE_expr</text>
  <text x="1635" y="388" class="tiny">label supervision on both branches</text>

  <rect x="1565" y="450" width="405" height="112" rx="20" fill="#fff2d8" stroke="#d97706" stroke-width="2.2"/>
  <rect x="1585" y="468" width="36" height="22" rx="7" fill="#d97706"/>
  <text x="1597" y="484" class="tag">C</text>
  <text x="1635" y="485" class="label">Alignment loss</text>
  <text x="1635" y="516" class="small">L_align = MSE or symmetric InfoNCE</text>
  <text x="1635" y="543" class="tiny">paired positives + batch negatives</text>

  <rect x="1565" y="605" width="405" height="88" rx="20" fill="#13213a" stroke="#13213a"/>
  <text x="1595" y="638" class="whiteLabel">Total loss after the two arrows</text>
  <text x="1595" y="668" class="whiteSmall">L_total = L_cls + lambda * L_align</text>

  <!-- Main arrows -->
  <path d="M370 354 L450 354" class="line"/>
  <path d="M750 354 L835 354" class="line"/>
  <path d="M1095 354 C1135 354 1150 420 1190 440" class="line"/>
  <path d="M370 582 L450 582" class="line"/>
  <path d="M750 582 L835 582" class="line"/>
  <path d="M1095 582 C1135 582 1150 500 1190 482" class="line"/>
  <path d="M1470 440 L1565 350" class="orangeLine"/>
  <path d="M1470 482 L1565 505" class="orangeLine"/>
  <path d="M1768 407 C1805 560 1810 580 1768 605" class="orangeLine"/>
  <path d="M1768 562 C1810 590 1810 590 1768 605" class="orangeLine"/>

  <!-- SAM3 integration -->
  <text x="70" y="805" class="section">2. After SAM3 has candidate masks: how the trained model is used</text>
  <rect x="70" y="835" width="960" height="370" rx="28" class="box" fill="#fffdf6" stroke="#d8d2c3"/>

  <rect x="105" y="900" width="185" height="72" rx="15" fill="#ddeff5" stroke="#2f6f9f" stroke-width="2.2"/>
  <text x="125" y="928" class="label">SAM3 masks</text>
  <text x="125" y="953" class="tiny">candidate regions</text>

  <rect x="355" y="900" width="205" height="72" rx="15" fill="#e3f3ea" stroke="#2f7d62" stroke-width="2.2"/>
  <text x="375" y="928" class="label">H&amp;E embedding</text>
  <text x="375" y="953" class="tiny">one vector per mask</text>

  <rect x="105" y="1035" width="185" height="72" rx="15" fill="#fff2d8" stroke="#d97706" stroke-width="2.2"/>
  <text x="125" y="1063" class="label">Target biology</text>
  <text x="125" y="1088" class="tiny">expression / tissue query</text>

  <rect x="355" y="1035" width="205" height="72" rx="15" fill="#e3f3ea" stroke="#2f7d62" stroke-width="2.2"/>
  <text x="375" y="1063" class="label">Expr embedding</text>
  <text x="375" y="1088" class="tiny">query vector</text>

  <rect x="625" y="955" width="165" height="92" rx="17" fill="#e9e3f6" stroke="#665191" stroke-width="2.2"/>
  <text x="652" y="990" class="label">similarity</text>
  <text x="655" y="1018" class="tiny">score each mask</text>

  <rect x="840" y="955" width="150" height="92" rx="17" fill="#203b63" stroke="#13213a" stroke-width="2.2"/>
  <text x="878" y="990" class="whiteLabel">rank</text>
  <text x="872" y="1018" class="whiteSmall">top-k masks</text>

  <path d="M290 936 L355 936" class="greenLine"/>
  <path d="M290 1071 L355 1071" class="greenLine"/>
  <path d="M560 936 C595 936 600 980 625 988" class="purpleLine"/>
  <path d="M560 1071 C595 1071 600 1025 625 1015" class="purpleLine"/>
  <path d="M790 1001 L840 1001" class="purpleLine"/>

  <text x="110" y="860" class="tiny">SAM3 generates the candidate regions; the trained H&amp;E-expression model ranks them by biological relevance.</text>
  <text x="110" y="1165" class="small">Example: if the target is immune-infiltration-like expression, the model ranks SAM3 masks by how well each mask's H&amp;E embedding matches that expression embedding.</text>

  <!-- Experiment tests -->
  <text x="1100" y="805" class="section">3. Different tests: what exactly changed?</text>
  <rect x="1100" y="835" width="1025" height="370" rx="28" class="box" fill="#ffffff" stroke="#d8d2c3"/>

  <rect x="1135" y="885" width="300" height="78" rx="16" fill="#ddeff5" stroke="#2f6f9f" stroke-width="2.2"/>
  <text x="1160" y="913" class="label">Backbone baseline -> A</text>
  <text x="1160" y="938" class="tiny">Replace Image encoder: ResNet50 vs GigaPath.</text>
  <text x="1160" y="957" class="tiny">Tests whether pathology foundation features help H&amp;E.</text>

  <rect x="1480" y="885" width="300" height="78" rx="16" fill="#ddeff5" stroke="#2f6f9f" stroke-width="2.2"/>
  <text x="1505" y="913" class="label">Crop / labels -> input + CE</text>
  <text x="1505" y="938" class="tiny">Change crop64/crop128 and 3-class/8-class labels.</text>
  <text x="1505" y="957" class="tiny">Tests context size and label granularity.</text>

  <rect x="1135" y="995" width="300" height="78" rx="16" fill="#ddeff5" stroke="#2f6f9f" stroke-width="2.2"/>
  <text x="1160" y="1023" class="label">Embedding size -> B</text>
  <text x="1160" y="1048" class="tiny">Change projection output: embed128 vs embed512.</text>
  <text x="1160" y="1067" class="tiny">Tests shared-space capacity.</text>

  <rect x="1480" y="995" width="300" height="78" rx="16" fill="#fff2d8" stroke="#d97706" stroke-width="2.2"/>
  <text x="1505" y="1023" class="label">Loss ablation -> C</text>
  <text x="1505" y="1048" class="tiny">CE-only vs CE+MSE vs CE+InfoNCE vs InfoNCE-only.</text>
  <text x="1505" y="1067" class="tiny">Tests classification supervision vs alignment.</text>

  <rect x="1135" y="1105" width="300" height="78" rx="16" fill="#e3f3ea" stroke="#2f7d62" stroke-width="2.2"/>
  <text x="1160" y="1133" class="label">Fine-tuning -> A</text>
  <text x="1160" y="1158" class="tiny">In the Image encoder, unfreeze 0 / 1 / 2</text>
  <text x="1160" y="1177" class="tiny">last GigaPath transformer blocks.</text>

  <rect x="1480" y="1105" width="300" height="78" rx="16" fill="#e9e3f6" stroke="#665191" stroke-width="2.2"/>
  <text x="1505" y="1133" class="label">Retrieval / fusion eval -> SAM3</text>
  <text x="1505" y="1158" class="tiny">Use expression query to retrieve H&amp;E exemplars.</text>
  <text x="1505" y="1177" class="tiny">Then rank SAM3 masks/prompts.</text>

  <rect x="1850" y="910" width="225" height="245" rx="18" fill="#f8e1e4" stroke="#aa3a45" stroke-width="2.2"/>
  <text x="1875" y="944" class="label">How to say it</text>
  <text x="1875" y="982" class="small">Each test changes one</text>
  <text x="1875" y="1006" class="small">part of the framework,</text>
  <text x="1875" y="1030" class="small">then the resulting</text>
  <text x="1875" y="1054" class="small">checkpoint is judged by</text>
  <text x="1875" y="1078" class="small">classification and, when</text>
  <text x="1875" y="1102" class="small">run, retrieval.</text>

  <rect x="70" y="1245" width="2055" height="34" rx="11" fill="#13213a"/>
  <text x="100" y="1269" class="whiteLabel">Key message: training learns a shared H&amp;E-expression space; retrieval uses that space downstream to retrieve exemplars and rank SAM3 masks/prompts.</text>
</svg>
