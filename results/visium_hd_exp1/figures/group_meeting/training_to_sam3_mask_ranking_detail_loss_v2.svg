<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1350" viewBox="0 0 2200 1350">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#465261"/>
    </marker>
    <marker id="greenArrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#2f7d62"/>
    </marker>
    <marker id="orangeArrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#c06a13"/>
    </marker>
    <marker id="purpleArrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#665191"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 700 44px Arial, sans-serif; fill: #13213a; }
      .subtitle { font: 400 22px Arial, sans-serif; fill: #5f6f7e; }
      .section { font: 700 28px Arial, sans-serif; fill: #13213a; }
      .label { font: 700 21px Arial, sans-serif; fill: #13213a; }
      .small { font: 400 17px Arial, sans-serif; fill: #374151; }
      .tiny { font: 400 14px Arial, sans-serif; fill: #5f6f7e; }
      .note { font: 700 14px Arial, sans-serif; fill: #7c4a03; }
      .whiteLabel { font: 700 21px Arial, sans-serif; fill: #ffffff; }
      .whiteSmall { font: 400 16px Arial, sans-serif; fill: #ffffff; }
      .box { stroke-width: 2.2; filter: url(#shadow); }
      .line { stroke: #465261; stroke-width: 3.4; fill: none; marker-end: url(#arrow); }
      .greenLine { stroke: #2f7d62; stroke-width: 3.4; fill: none; marker-end: url(#greenArrow); }
      .orangeLine { stroke: #c06a13; stroke-width: 3.4; fill: none; marker-end: url(#orangeArrow); }
      .purpleLine { stroke: #665191; stroke-width: 3.4; fill: none; marker-end: url(#purpleArrow); }
      .dash { stroke-dasharray: 9 8; }
      .tag { font: 700 14px Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect width="2200" height="1350" fill="#f7f3ea"/>
  <text x="70" y="65" class="title">From H&amp;E-Expression Training to SAM3 Mask Ranking</text>
  <text x="72" y="103" class="subtitle">The training does not output masks. It learns a shared embedding model that later scores SAM3 candidate masks by biological relevance.</text>

  <!-- Part 1 training -->
  <text x="70" y="165" class="section">1. Training stage: learn a shared H&amp;E-expression embedding model</text>
  <rect x="70" y="198" width="2060" height="535" rx="30" class="box" fill="#fffdf6" stroke="#d8d2c3"/>

  <rect x="110" y="300" width="245" height="120" rx="18" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/>
  <text x="140" y="333" class="label">H&amp;E crop</text>
  <text x="140" y="365" class="small">image patch around one</text>
  <text x="140" y="390" class="small">VisiumHD coordinate</text>

  <rect x="110" y="510" width="245" height="120" rx="18" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/>
  <text x="140" y="543" class="label">Expression vector</text>
  <text x="140" y="575" class="small">18,085-gene profile</text>
  <text x="140" y="600" class="small">same location as crop</text>

  <rect x="440" y="270" width="285" height="165" rx="20" fill="#ddeff5" stroke="#2f6f9f" stroke-width="2.2"/>
  <text x="475" y="313" class="label">Image encoder</text>
  <text x="475" y="346" class="small">ResNet50 or GigaPath</text>
  <text x="475" y="375" class="tiny">pretrained or trainable image</text>
  <text x="475" y="398" class="tiny">feature extractor</text>

  <rect x="440" y="500" width="285" height="145" rx="20" fill="#e3f3ea" stroke="#2f7d62" stroke-width="2.2"/>
  <text x="475" y="543" class="label">Expression MLP</text>
  <text x="475" y="576" class="small">trainable gene-expression</text>
  <text x="475" y="602" class="small">encoder</text>

  <rect x="815" y="270" width="250" height="165" rx="20" fill="#e3f3ea" stroke="#2f7d62" stroke-width="2.2"/>
  <text x="845" y="313" class="label">Image projection</text>
  <text x="845" y="346" class="small">trainable head</text>
  <text x="845" y="375" class="tiny">outputs image embedding</text>

  <rect x="815" y="500" width="250" height="145" rx="20" fill="#e3f3ea" stroke="#2f7d62" stroke-width="2.2"/>
  <text x="845" y="543" class="label">Expression projection</text>
  <text x="845" y="576" class="small">trainable head</text>
  <text x="845" y="602" class="tiny">outputs expression embedding</text>

  <rect x="1170" y="385" width="280" height="140" rx="24" fill="#203b63" stroke="#13213a" stroke-width="2.2"/>
  <text x="1205" y="428" class="whiteLabel">Shared embedding space</text>
  <text x="1205" y="462" class="whiteSmall">image and expression vectors</text>
  <text x="1205" y="488" class="whiteSmall">can be compared by similarity</text>

  <rect x="1545" y="260" width="415" height="115" rx="20" fill="#fff2d8" stroke="#d97706" stroke-width="2.2"/>
  <text x="1590" y="317" class="label">Classification loss</text>
  <text x="1590" y="350" class="small">L_cls = CE_img + CE_expr</text>
  <text x="1590" y="375" class="tiny">each branch predicts tissue label</text>

  <rect x="1545" y="410" width="415" height="115" rx="20" fill="#fff2d8" stroke="#d97706" stroke-width="2.2"/>
  <text x="1590" y="467" class="label">Alignment loss</text>
  <text x="1590" y="500" class="small">L_align = MSE or symmetric InfoNCE</text>
  <text x="1590" y="525" class="tiny">matched pairs close; wrong pairs separated</text>

  <rect x="1545" y="560" width="415" height="105" rx="20" fill="#fff8ed" stroke="#d97706" stroke-width="2.2"/>
  <text x="1590" y="594" class="label">Total training loss</text>
  <text x="1590" y="626" class="small">L_total = CE_img + CE_expr + lambda * L_align</text>
  <text x="1590" y="651" class="tiny">lambda controls alignment strength</text>

  <rect x="1180" y="610" width="360" height="80" rx="20" fill="#13213a" stroke="#13213a" stroke-width="2.2"/>
  <text x="1210" y="642" class="whiteLabel">Training output</text>
  <text x="1210" y="672" class="whiteSmall">best.pt = trained encoders + projections</text>

  <rect x="110" y="675" width="955" height="36" rx="12" fill="#fff2d8" stroke="#d97706" stroke-width="2"/>
  <text x="135" y="699" class="note">Tissue label: 3-class = tumor / stroma / immune infiltration; 8-class = fine expert tissue labels.</text>

  <path d="M355 360 L440 360" class="line"/>
  <path d="M725 352 L815 352" class="line"/>
  <path d="M1065 352 C1115 352 1125 430 1170 440" class="line"/>
  <path d="M355 570 L440 570" class="line"/>
  <path d="M725 572 L815 572" class="line"/>
  <path d="M1065 572 C1115 572 1125 490 1170 475" class="line"/>
  <path d="M1450 440 L1545 318" class="orangeLine"/>
  <path d="M1450 475 L1545 468" class="orangeLine"/>
  <path d="M1752 375 L1752 410" class="orangeLine"/>
  <path d="M1752 525 L1752 560" class="orangeLine"/>
  <path d="M1545 620 L1540 650" class="orangeLine"/>

  <!-- Part 2 SAM3 candidate ranking -->
  <text x="70" y="800" class="section">2. Use after SAM3 has candidate masks: score and rank masks by target biology</text>
  <rect x="70" y="835" width="2060" height="430" rx="30" class="box" fill="#fffdf6" stroke="#d8d2c3"/>

  <rect x="115" y="910" width="240" height="115" rx="20" fill="#ddeff5" stroke="#2f6f9f" stroke-width="2.2"/>
  <text x="145" y="950" class="label">SAM3 candidate masks</text>
  <text x="145" y="982" class="small">masks / boxes / regions</text>
  <text x="145" y="1008" class="tiny">SAM3 generates candidates</text>

  <rect x="430" y="910" width="250" height="115" rx="20" fill="#e3f3ea" stroke="#2f7d62" stroke-width="2.2"/>
  <text x="460" y="950" class="label">Crop or pool H&amp;E</text>
  <text x="460" y="982" class="small">inside each candidate mask</text>
  <text x="460" y="1008" class="tiny">one region per mask</text>

  <rect x="755" y="910" width="250" height="115" rx="20" fill="#e3f3ea" stroke="#2f7d62" stroke-width="2.2"/>
  <text x="785" y="950" class="label">H&amp;E embedding</text>
  <text x="785" y="982" class="small">use trained image encoder</text>
  <text x="785" y="1008" class="tiny">one vector per mask</text>

  <rect x="430" y="1085" width="250" height="115" rx="20" fill="#fff2d8" stroke="#d97706" stroke-width="2.2"/>
  <text x="460" y="1125" class="label">Target biology</text>
  <text x="460" y="1157" class="small">expression profile / tissue</text>
  <text x="460" y="1183" class="tiny">example: immune infiltration</text>

  <rect x="755" y="1085" width="250" height="115" rx="20" fill="#e3f3ea" stroke="#2f7d62" stroke-width="2.2"/>
  <text x="785" y="1125" class="label">Expression embedding</text>
  <text x="785" y="1157" class="small">use trained expression encoder</text>
  <text x="785" y="1183" class="tiny">query vector</text>

  <rect x="1090" y="990" width="220" height="115" rx="20" fill="#e9e3f6" stroke="#665191" stroke-width="2.2"/>
  <text x="1130" y="1033" class="label">Similarity score</text>
  <text x="1130" y="1065" class="small">score(mask_i) = sim</text>
  <text x="1130" y="1090" class="tiny">H&amp;E emb_i vs expression emb</text>

  <rect x="1395" y="990" width="220" height="115" rx="20" fill="#203b63" stroke="#13213a" stroke-width="2.2"/>
  <text x="1450" y="1033" class="whiteLabel">Rank masks</text>
  <text x="1445" y="1065" class="whiteSmall">top-k candidates</text>
  <text x="1445" y="1090" class="whiteSmall">biologically relevant</text>

  <rect x="1705" y="945" width="300" height="205" rx="22" fill="#f8e1e4" stroke="#aa3a45" stroke-width="2.2"/>
  <text x="1740" y="985" class="label">What this gives SAM3</text>
  <text x="1740" y="1022" class="small">select best mask</text>
  <text x="1740" y="1052" class="small">rank candidate masks</text>
  <text x="1740" y="1082" class="small">choose prompts / boxes</text>
  <text x="1740" y="1112" class="small">retrieve exemplar regions</text>

  <path d="M355 968 L430 968" class="greenLine"/>
  <path d="M680 968 L755 968" class="greenLine"/>
  <path d="M680 1143 L755 1143" class="greenLine"/>
  <path d="M1005 968 C1045 968 1050 1025 1090 1035" class="purpleLine"/>
  <path d="M1005 1143 C1045 1143 1050 1075 1090 1063" class="purpleLine"/>
  <path d="M1310 1048 L1395 1048" class="purpleLine"/>
  <path d="M1615 1048 L1705 1048" class="purpleLine"/>

  <rect x="115" y="1220" width="1280" height="30" rx="10" fill="#ecfdf5" stroke="#2f7d62" stroke-width="2"/>
  <text x="140" y="1241" class="note">Meaning: the trained model does not create candidate masks. It gives each SAM3 mask a biology relevance score.</text>

  <rect x="70" y="1300" width="2060" height="34" rx="11" fill="#13213a"/>
  <text x="100" y="1324" class="whiteLabel">One sentence: SAM3 cuts possible regions; the H&amp;E-expression model decides which regions best match the target biology.</text>
</svg>
